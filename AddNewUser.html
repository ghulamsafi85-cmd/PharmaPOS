
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add New User</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 15% 10%,#174c70 0%,#10243d 42%,#10152d 100%);color:#fff}
.user-wrapper{width:100%;max-width:590px;padding:1px;border-radius:25px;background:linear-gradient(135deg,rgba(151,220,229,.8),rgba(75,131,169,.45),rgba(173,151,211,.65));box-shadow:0 24px 65px rgba(0,0,0,.38)}
.user-container{padding:15px;border-radius:24px;background:linear-gradient(145deg,rgba(28,76,105,.96),rgba(26,43,75,.98) 55%,rgba(49,48,86,.96));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.user-card{width:100%;max-width:455px;margin:auto;padding:22px 30px 17px;border:1px solid rgba(220,239,255,.18);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 14px 35px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.1);text-align:center}
h2{font-size:27px;font-weight:700;letter-spacing:.4px;color:#f1d9a5;margin-bottom:17px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.fields{display:flex;flex-direction:column;gap:8px}
.input-group{height:46px;width:100%;border-radius:11px;display:flex;align-items:center;padding:0 13px;background:rgba(7,20,39,.28);border:1px solid rgba(194,220,240,.22);box-shadow:inset 0 2px 5px rgba(0,0,0,.12);transition:border-color .2s,background .2s,box-shadow .2s}
.input-group:focus-within{border-color:rgba(145,211,224,.8);background:rgba(7,20,39,.4);box-shadow:0 0 0 3px rgba(90,174,194,.1)}
.input-group>svg{width:21px;height:21px;fill:none;stroke:#b9d7e4;stroke-width:1.7;flex-shrink:0}
.input-group input{flex:1;min-width:0;width:100%;height:100%;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#fff!important;-webkit-text-fill-color:#fff!important;caret-color:#fff;font-size:15px;padding:0 13px;text-align:center}
.input-group input::placeholder{color:rgba(222,235,245,.72);-webkit-text-fill-color:rgba(222,235,245,.72)}
.input-group input:read-only{color:#f1d9a5!important;-webkit-text-fill-color:#f1d9a5!important;cursor:default}
.input-group input:-webkit-autofill,.input-group input:-webkit-autofill:hover,.input-group input:-webkit-autofill:focus{-webkit-text-fill-color:#fff!important;-webkit-box-shadow:0 0 0 1000px #20344d inset!important;transition:background-color 9999s ease-in-out 0s}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}
.buttons button{height:42px;width:100%;border:1px solid rgba(255,255,255,.13);border-radius:10px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.1px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15),inset 0 1px rgba(255,255,255,.13);transition:transform .18s,filter .18s,box-shadow .18s}
.buttons button:hover:not(:disabled){filter:brightness(1.14);transform:translateY(-2px);box-shadow:0 7px 14px rgba(0,0,0,.22)}
.buttons button:active:not(:disabled){transform:scale(.97)}
.buttons button:disabled{opacity:.42;cursor:not-allowed}
.add{background:linear-gradient(135deg,#247d83,#17636e)}
.save{background:linear-gradient(135deg,#39865d,#236a49)}
.next{background:linear-gradient(135deg,#426eaa,#31548b)}
.previous{background:linear-gradient(135deg,#7761a8,#594786)}
.delete{background:linear-gradient(135deg,#a74d59,#813943)}
.close{background:linear-gradient(135deg,#64748b,#465467)}
#message{min-height:20px;margin-top:12px;font-size:12px;font-weight:600;color:#d9e8f0;line-height:1.5;overflow-wrap:anywhere}
#message.error{color:#ffaaaa}
#message.success{color:#a9e7c3}
@media(max-width:480px){
body{padding:8px}
.user-container{padding:10px;border-radius:20px}
.user-card{padding:17px 14px 13px;border-radius:16px}
h2{font-size:24px;margin-bottom:13px}
.fields{gap:7px}
.input-group{height:43px;padding:0 10px}
.input-group input{font-size:14px;padding:0 9px}
.buttons{gap:6px;margin-top:12px}
.buttons button{height:39px;font-size:10px}
#message{font-size:11px;margin-top:9px}
}
@media(max-height:600px){
.user-container{padding:8px}
.user-card{padding:10px 24px}
h2{font-size:22px;margin-bottom:8px}
.fields{gap:5px}
.input-group{height:37px}
.buttons{gap:5px;margin-top:9px}
.buttons button{height:34px}
#message{margin-top:6px;min-height:16px}
}
</style>
</head>
<body>
<div class="user-wrapper">
<div class="user-container">
<section class="user-card">
<h2>Add New User</h2>
<div class="fields">
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
<input id="userid" type="number" placeholder="User ID" readonly>
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg>
<input id="username" type="text" placeholder="User Name" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>
<input id="email" type="email" placeholder="Email Address" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3M12 15v3"/></svg>
<input id="userpassword" type="password" placeholder="User Password" autocomplete="new-password">
</div>
</div>
<div class="buttons">
<button id="addBtn" class="add" type="button" onclick="addNew()" disabled>➕ Add New</button>
<button id="saveBtn" class="save" type="button" onclick="saveUser()" disabled>💾 Save/Edit</button>
<button id="nextBtn" class="next" type="button" onclick="nextRecord()" disabled>⏭ Next Rec</button>
<button id="previousBtn" class="previous" type="button" onclick="previousRecord()" disabled>⏮ Previous</button>
<button id="deleteBtn" class="delete" type="button" onclick="deleteUser()" disabled>🗑 Delete</button>
<button class="close" type="button" onclick="closeForm()">✖ Close</button>
</div>
<p id="message">Connecting to cloud...</p>
</section>
</div>
</div>
<script>
const WORKER_URL="https://young-river-e88c.ghulam-safi85.workers.dev";
const REQUEST_TIMEOUT=20000;
let users=[];
let currentIndex=-1;
let currentUid=null;
let ready=false;
let busy=false;
const el=id=>document.getElementById(id);
function showMessage(message,type=""){
el("message").textContent=message;
el("message").className=type;
}
function adminToken(){
return sessionStorage.getItem("firebaseIdToken")||"";
}
function setButtons(){
const enabled=ready&&!busy;
["addBtn","saveBtn","nextBtn","previousBtn","deleteBtn"].forEach(id=>el(id).disabled=!enabled);
}
function setBusy(value){
busy=value;
setButtons();
}
async function request(path,data={}){
const token=adminToken();
if(!token)throw new Error("Administrator session expired. Please login again.");
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT);
try{
const response=await fetch(WORKER_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,adminToken:token}),signal:controller.signal,cache:"no-store"});
let result;
try{result=await response.json();}catch(e){throw new Error("Invalid response received from cloud.");}
if(!response.ok||!result.success)throw new Error(result.message||"Cloud request failed.");
return result;
}catch(e){
if(e.name==="AbortError")throw new Error("Connection timed out. Please try again.");
throw e;
}finally{clearTimeout(timer);}
}
function nextId(){
const adminId=Number(sessionStorage.getItem("currentUserId"))||1;
return users.reduce((max,u)=>Math.max(max,Number(u.userid)||0),adminId)+1;
}
function clearFields(message=""){
el("userid").value=nextId();
el("username").value="";
el("email").value="";
el("userpassword").value="";
currentUid=null;
currentIndex=-1;
if(message)showMessage(message);
}
function showRecord(index){
if(index<0||index>=users.length)return false;
const user=users[index];
currentIndex=index;
currentUid=user.uid;
el("userid").value=user.userid;
el("username").value=user.username||"";
el("email").value=user.email||"";
el("userpassword").value="";
showMessage("User record loaded.","success");
return true;
}
async function loadUsers(selectUid=null){
const result=await request("/list-users");
users=Array.isArray(result.users)?result.users:[];
users.sort((a,b)=>(Number(a.userid)||0)-(Number(b.userid)||0));
if(selectUid){
const index=users.findIndex(u=>u.uid===selectUid);
if(index>=0){
showRecord(index);
return;
}
}
clearFields(users.length?"Ready for a new user.":"No users found. Ready to add a new user.");
}
function addNew(){
if(!ready||busy)return;
clearFields("New user form is ready.","success");
el("username").focus();
}
function validateUser(){
const username=el("username").value.trim();
const email=el("email").value.trim();
const password=el("userpassword").value;
const userid=Number(el("userid").value);
if(!username)throw new Error("Please enter a username.");
if(!email)throw new Error("Please enter an email address.");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Please enter a valid email address.");
if(!currentUid&&password.length<6)throw new Error("Password must contain at least 6 characters.");
if(password&&password.length<6)throw new Error("Password must contain at least 6 characters.");
if(!Number.isInteger(userid)||userid<1)throw new Error("Invalid User ID.");
return {username,email,password,userid};
}
async function saveUser(){
if(!ready||busy)return;
let data;
try{data=validateUser();}catch(e){showMessage(e.message,"error");return;}
setBusy(true);
showMessage(currentUid?"Updating user...":"Creating new user...");
try{
let result;
if(currentUid){
const payload={uid:currentUid,username:data.username,email:data.email};
if(data.password)payload.password=data.password;
result=await request("/update-user",payload);
}else{
result=await request("/create-user",{userid:data.userid,username:data.username,email:data.email,password:data.password});
}
await loadUsers(result.uid||currentUid);
showMessage(result.message||"User saved successfully.","success");
}catch(e){
showMessage(e.message||"Unable to save user.","error");
}finally{setBusy(false);}
}
function nextRecord(){
if(!ready||busy)return;
if(!users.length){showMessage("No user records found.","error");return;}
if(currentIndex<0){showRecord(0);return;}
if(currentIndex>=users.length-1){showMessage("Last record reached.");return;}
showRecord(currentIndex+1);
}
function previousRecord(){
if(!ready||busy)return;
if(!users.length){showMessage("No user records found.","error");return;}
if(currentIndex<0){showRecord(users.length-1);return;}
if(currentIndex===0){showMessage("First record reached.");return;}
showRecord(currentIndex-1);
}
async function deleteUser(){
if(!ready||busy)return;
if(!currentUid){showMessage("Please select a user first.","error");return;}
const selectedUid=currentUid;
const selectedIndex=currentIndex;
if(!confirm("Are you sure you want to delete this user?"))return;
setBusy(true);
showMessage("Deleting user...");
try{
const result=await request("/delete-user",{uid:selectedUid});
await loadUsers();
if(users.length)showRecord(Math.min(selectedIndex,users.length-1));
else clearFields("No user records remain.");
showMessage(result.message||"User deleted successfully.","success");
}catch(e){
showMessage(e.message||"Delete failed.","error");
}finally{setBusy(false);}
}
function closeForm(){
try{
if(window.parent&&window.parent!==window){
const panel=window.parent.document.getElementById("MainPanel");
if(panel){panel.innerHTML="";return;}
}
}catch(e){}
window.close();
}
async function startForm(){
try{
if(!adminToken())throw new Error("Administrator session expired. Please login again.");
await loadUsers();
ready=true;
setButtons();
showMessage("Cloud connection successful.","success");
}catch(e){
ready=false;
setButtons();
showMessage(e.message||"Unable to connect to cloud.","error");
}
}
startForm();
</script>
</body>
</html>
