
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New User</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f7;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:25px 12px}
.user-card{width:100%;max-width:520px;background:white;padding:20px;border-radius:15px;box-shadow:0 5px 22px #123e6220;border-top:5px solid #087e8b}
h2{text-align:center;color:#123e62;margin:0 0 16px;font-size:22px}
.fields{display:flex;flex-direction:column;gap:7px}
input{width:100%;height:43px;border:1px solid #b8cbd8;border-radius:8px;background:#f8fbfd;text-align:center;font-size:16px;color:#123e62;outline:none;padding:8px}
input:focus{border-color:#087e8b;box-shadow:0 0 0 3px #087e8b20;background:white}
input[readonly]{background:#eaf1f6;color:#075985;font-weight:bold}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
button{height:43px;border:0;border-radius:8px;color:white;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 2px 5px #0002;transition:.15s}
button:active{transform:scale(.97)}
.add{background:#087e8b}
.save{background:#16803c}
.next{background:#2563eb}
.previous{background:#7c3aed}
.delete{background:#dc3545}
.close{background:#475569}
button:hover{filter:brightness(.92)}
#message{text-align:center;min-height:20px;margin:10px 0 0;font-size:13px;font-weight:bold;color:#16803c}
@media(max-width:380px){body{padding:12px 7px}.user-card{padding:13px}.buttons{gap:5px}button{font-size:11px;height:41px}input{height:41px}}
</style>
</head>
<body>
<section class="user-card">
<h2>Add New User</h2>
<div class="fields">
<input id="userid" type="number" placeholder="User ID" readonly>
<input id="username" type="text" placeholder="Username" autocomplete="off">
<input id="userpassword" type="password" placeholder="Password" autocomplete="new-password">
</div>
<div class="buttons">
<button class="add" onclick="addNew()">➕ Add New</button>
<button class="save" onclick="saveUser()">💾 Save/Edit</button>
<button class="next" onclick="nextRecord()">⏭ Next Rec</button>
<button class="previous" onclick="previousRecord()">⏮ Previous</button>
<button class="delete" onclick="deleteUser()">🗑 Delete</button>
<button class="close" onclick="closeForm()">✖ Close</button>
</div>
<p id="message"></p>
</section>
<script src="Database/sql-wasm.js"></script>
<script src="Database/database.js"></script>
<script>
let currentId=null;
function showMessage(text,error=false){
const m=document.getElementById("message");
m.textContent=text;
m.style.color=error?"#dc3545":"#16803c";
}
function nextId(){
const r=db.exec("SELECT COALESCE(MAX(userid),0)+1 FROM users");
return r[0].values[0][0];
}
function clearFields(){
document.getElementById("userid").value=nextId();
document.getElementById("username").value="";
document.getElementById("userpassword").value="";
currentId=null;
}
function readRecord(id){
const s=db.prepare("SELECT userid,username,userpassword FROM users WHERE userid=?");
try{
s.bind([id]);
if(!s.step())return false;
const r=s.getAsObject();
document.getElementById("userid").value=r.userid;
document.getElementById("username").value=r.username;
document.getElementById("userpassword").value=r.userpassword;
currentId=r.userid;
return true;
}finally{s.free()}
}
function addNew(){
clearFields();
showMessage("Ready for a new user.");
document.getElementById("username").focus();
}
function saveUser(){
const id=Number(document.getElementById("userid").value);
const username=document.getElementById("username").value.trim();
const password=document.getElementById("userpassword").value;
if(!id||!username||!password)return showMessage("Please enter username and password.",true);
try{
const exists=db.exec("SELECT userid FROM users WHERE userid="+id);
if(exists.length&&exists[0].values.length){
const s=db.prepare("UPDATE users SET username=?,userpassword=? WHERE userid=?");
try{s.run([username,password,id])}finally{s.free()}
}else{
const s=db.prepare("INSERT INTO users(userid,username,userpassword) VALUES(?,?,?)");
try{s.run([id,username,password])}finally{s.free()}
}
saveDatabase();
readRecord(id);
showMessage("User saved successfully.");
}catch(e){
showMessage("Unable to save. Username may already exist.",true);
}
}
function nextRecord(){
let r;
if(currentId===null)r=db.exec("SELECT MIN(userid) FROM users");
else{
const s=db.prepare("SELECT MIN(userid) FROM users WHERE userid>?");
try{s.bind([currentId]);r=s.step()?[[s.get()[0]]]:[]}finally{s.free()}
}
const id=r.length&&r[0].values?r[0].values[0][0]:r[0]?.[0];
if(id===null||id===undefined)return showMessage("No next record found.",true);
readRecord(id);
showMessage("Record loaded.");
}
function previousRecord(){
let id;
if(currentId===null){
const r=db.exec("SELECT MAX(userid) FROM users");
id=r[0].values[0][0];
}else{
const s=db.prepare("SELECT MAX(userid) FROM users WHERE userid<?");
try{s.bind([currentId]);id=s.step()?s.get()[0]:null}finally{s.free()}
}
if(id===null)return showMessage("No previous record found.",true);
readRecord(id);
showMessage("Record loaded.");
}
function deleteUser(){
const id=Number(document.getElementById("userid").value);
if(!id||!confirm("Are you sure you want to delete this user?"))return;
const s=db.prepare("DELETE FROM users WHERE userid=?");
try{s.run([id])}finally{s.free()}
saveDatabase();
clearFields();
showMessage("User deleted successfully.");
}
function closeForm(){
window.parent.document.getElementById("MainPanel").innerHTML="";
}
async function startForm(){
try{
await initDatabase();
clearFields();
document.getElementById("username").focus();
}catch(e){
showMessage("Database initialization failed.",true);
}
}
document.addEventListener("DOMContentLoaded",startForm);
</script>
</body>
</html>
