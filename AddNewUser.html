
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New User</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:10px;background:radial-gradient(circle at 15% 20%,#087eaa,#07152e 48%,#160d36);color:white}
.user-wrapper{width:100%;max-width:620px;max-height:calc(100vh - 20px);padding:2px;border-radius:30px;background:linear-gradient(135deg,#32eaff,#293cce,#a34af5,#24dfff);box-shadow:0 0 40px rgba(0,180,255,.2)}
.user-container{padding:14px 16px;border-radius:28px;background:linear-gradient(135deg,rgba(9,185,212,.75),rgba(23,58,145,.85) 48%,rgba(164,79,229,.8));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.user-card{width:100%;max-width:470px;margin:auto;padding:17px 30px 18px;border:1px solid rgba(255,255,255,.4);border-radius:25px;background:rgba(255,255,255,.12);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 12px 35px rgba(0,0,0,.2);text-align:center}
h2{color:white;font-size:30px;font-weight:700;margin-bottom:12px;text-shadow:0 3px 5px rgba(0,0,0,.2)}
.fields{display:flex;flex-direction:column;gap:0}
.input-group{height:48px;width:100%;margin-bottom:6px;border-radius:14px;display:flex;align-items:center;padding:0 16px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25)}
.input-group>svg{width:25px;height:25px;fill:none;stroke:white;stroke-width:2;flex-shrink:0}
.input-group input{flex:1;min-width:0;width:100%;height:100%;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#fff!important;-webkit-text-fill-color:#fff!important;caret-color:#fff;font-size:17px;padding:0 15px;text-align:center}
.input-group input:focus,.input-group input:active{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
.input-group input::placeholder{color:rgba(255,255,255,.85);-webkit-text-fill-color:rgba(255,255,255,.85)}
.input-group input:-webkit-autofill,.input-group input:-webkit-autofill:hover,.input-group input:-webkit-autofill:focus{-webkit-text-fill-color:#fff!important;-webkit-box-shadow:0 0 0 1000px transparent inset!important;box-shadow:0 0 0 1000px transparent inset!important;transition:background-color 9999s ease-in-out 0s}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:3px}
.buttons button{width:100%;height:45px;border:1px solid rgba(255,255,255,.3);border-radius:12px;color:white;font-size:13px;font-weight:bold;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 12px rgba(0,0,0,.16),inset 0 1px 1px rgba(255,255,255,.15);transition:.2s}
.buttons button:active{transform:scale(.96)}
.buttons button:hover{filter:brightness(1.2)}
.buttons button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.add{background:rgba(8,126,139,.65)}
.save{background:rgba(22,128,60,.65)}
.next{background:rgba(37,99,235,.65)}
.previous{background:rgba(124,58,237,.65)}
.delete{background:rgba(220,53,69,.7)}
.close{background:rgba(71,85,105,.7)}
#message{min-height:20px;margin-top:9px;font-size:14px;font-weight:600;color:white;line-height:1.4;overflow-wrap:anywhere}
@media(max-width:480px){
.user-container{padding:12px 10px;border-radius:25px}
.user-card{padding:16px 15px 17px;border-radius:22px}
h2{font-size:25px;margin-bottom:11px}
.input-group{height:46px;margin-bottom:6px}
.input-group input{font-size:15px;padding:0 10px}
.buttons{gap:6px}
.buttons button{height:42px;font-size:11px}
#message{font-size:12px}
}
@media(max-height:600px){
.user-container{padding:8px 12px}
.user-card{padding:10px 24px}
h2{font-size:24px;margin-bottom:8px}
.input-group{height:40px;margin-bottom:4px}
.buttons{gap:5px;margin-top:2px}
.buttons button{height:38px}
#message{margin-top:5px;min-height:17px}
}
</style>
</head>
<body>
<div class="user-wrapper">
<div class="user-container">
<section class="user-card">
<h2>Add New User</h2>
<div class="fields">
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
<input id="userid" type="number" placeholder="User ID" readonly>
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg>
<input id="username" type="text" placeholder="User Name" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>
<input id="email" type="email" placeholder="Email Address" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3M12 15v3"/></svg>
<input id="userpassword" type="password" placeholder="User Password" autocomplete="new-password">
</div>
</div>
<div class="buttons">
<button class="add" onclick="addNew()" disabled>➕ Add New</button>
<button class="save" onclick="saveUser()" disabled>💾 Save/Edit</button>
<button class="next" onclick="nextRecord()" disabled>⏭ Next Rec</button>
<button class="previous" onclick="previousRecord()" disabled>⏮ Previous</button>
<button class="delete" onclick="deleteUser()" disabled>🗑 Delete</button>
<button class="close" onclick="closeForm()">✖ Close</button>
</div>
<p id="message">Connecting to cloud...</p>
</section>
</div>
</div>
<script>
const WORKER_URL="https://young-river-e88c.ghulam-safi85.workers.dev";
const REQUEST_TIMEOUT=20000;
let users=[];
let currentIndex=-1;
let currentUid=null;
let ready=false;
let busy=false;
const el=id=>document.getElementById(id);
function showMessage(message,error=false){
el("message").textContent=message;
el("message").style.color=error?"#ffb3b3":"#ffffff";
}
function setButtons(enabled){
document.querySelectorAll(".buttons button:not(.close)").forEach(b=>b.disabled=!enabled||busy);
}
function setBusy(value){
busy=value;
setButtons(ready);
}
function adminToken(){
return sessionStorage.getItem("firebaseIdToken")||"";
}
async function request(path,data={}){
const token=adminToken();
if(!token)throw new Error("Administrator session expired. Please login again.");
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT);
try{
const response=await fetch(WORKER_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,adminToken:token}),signal:controller.signal,cache:"no-store"});
const result=await response.json();
if(!response.ok||!result.success)throw new Error(result.message||"Cloud request failed.");
return result;
}catch(e){
if(e.name==="AbortError")throw new Error("Connection timed out. Please try again.");
throw e;
}finally{clearTimeout(timer);}
}
function nextId(){
const adminId=Number(sessionStorage.getItem("currentUserId"))||1;
return users.reduce((max,u)=>Math.max(max,Number(u.userid)||0),adminId)+1;
}
function clearFields(message="",id=null){
el("userid").value=id===null?nextId():id;
el("username").value="";
el("email").value="";
el("userpassword").value="";
currentUid=null;
currentIndex=-1;
if(message)showMessage(message);
}
function showRecord(index){
if(index<0||index>=users.length)return false;
const user=users[index];
currentIndex=index;
currentUid=user.uid;
el("userid").value=user.userid;
el("username").value=user.username;
el("email").value=user.email;
el("userpassword").value="";
showMessage("User record loaded.");
el("username").focus();
return true;
}
async function loadUsers(selectUid=null){
const result=await request("/list-users");
users=(result.users||[]).sort((a,b)=>Number(a.userid)-Number(b.userid));
if(selectUid){
const index=users.findIndex(u=>u.uid===selectUid);
if(index>=0){showRecord(index);return;}
}
clearFields(users.length?"Ready for a new user.":"No users found. Ready to add a new user.");
}
function addNew(){
if(!ready||busy)return;
clearFields("Ready for a new user.");
}
async function saveUser(){
if(!ready||busy)return;
const username=el("username").value.trim();
const email=el("email").value.trim();
const password=el("userpassword").value;
const userid=Number(el("userid").value);
if(!username)return showMessage("Please enter a username.",true);
if(!email)return showMessage("Please enter an email address.",true);
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showMessage("Please enter a valid email address.",true);
if(!currentUid&&password.length<6)return showMessage("Password must contain at least 6 characters.",true);
if(password&&password.length<6)return showMessage("Password must contain at least 6 characters.",true);
if(!Number.isInteger(userid)||userid<1)return showMessage("Invalid User ID.",true);
setBusy(true);
showMessage("Saving user...");
try{
let result;
if(currentUid){
result=await request("/update-user",{uid:currentUid,username,email,password});
}else{
result=await request("/create-user",{userid,username,email,password});
}
await loadUsers(result.uid||currentUid);
showMessage(result.message||"User saved successfully.");
}catch(e){showMessage(e.message||"Unable to save user.",true);}
finally{setBusy(false);}
}
function nextRecord(){
if(!ready||busy)return;
if(!users.length)return clearFields("No user records found.");
if(currentIndex<0||currentIndex>=users.length-1)return showMessage("Last record reached.");
showRecord(currentIndex+1);
}
function previousRecord(){
if(!ready||busy)return;
if(!users.length)return clearFields("No user records found.");
if(currentIndex<=0)return showMessage("First record reached.");
showRecord(currentIndex-1);
}
async function deleteUser(){
if(!ready||busy)return;
if(!currentUid)return showMessage("Please select a user first.",true);
if(!confirm("Are you sure you want to delete this user?"))return;
const deletedUid=currentUid;
setBusy(true);
showMessage("Deleting user...");
try{
const result=await request("/delete-user",{uid:deletedUid});
await loadUsers();
showMessage(result.message||"User deleted successfully.");
}catch(e){showMessage(e.message||"Delete failed.",true);}
finally{setBusy(false);}
}
function closeForm(){
const panel=window.parent.document.getElementById("MainPanel");
if(panel)panel.innerHTML="";
else window.close();
}
async function startForm(){
try{
if(!adminToken())throw new Error("Administrator session expired. Please login again.");
await loadUsers();
ready=true;
setButtons(true);
showMessage("Cloud connection successful.");
}catch(e){
ready=false;
setButtons(false);
showMessage(e.message||"Unable to connect to cloud.",true);
}
}
startForm();
</script>
</body>
</html>
