
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New User Registration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:12px;background:#e9eef4;color:#243449}
.user-wrapper{width:100%;max-width:560px;padding:0;background:#fff;border:1px solid #d9e1e9;border-radius:9px;box-shadow:0 8px 28px rgba(35,54,75,.12)}
.user-container{padding:25px 30px}
.user-card{width:100%;max-width:440px;margin:auto}
h2{font-size:23px;font-weight:600;color:#254b68;text-align:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #e5ebf0}
.fields{display:flex;flex-direction:column;gap:7px}
.input-group{height:49px;width:100%;display:flex;align-items:center;padding:0 12px;background:#f8fafc;border:1px solid #d5dee7;border-radius:6px;transition:border-color .15s,background .15s}
.input-group:focus-within{border-color:#5488b4;background:#fff}
.input-group>svg{width:19px;height:19px;fill:none;stroke:#6b8297;stroke-width:1.7;flex-shrink:0}
.input-group input{flex:1;min-width:0;width:100%;height:100%;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#263b50!important;-webkit-text-fill-color:#263b50!important;font-size:14px;padding:0 12px;text-align:center}
.input-group input::placeholder{color:#8999a9;-webkit-text-fill-color:#8999a9}
.input-group input:read-only{color:#315f83!important;-webkit-text-fill-color:#315f83!important;font-weight:600}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.buttons button{height:45px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:5px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.buttons button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.buttons button:hover{filter:brightness(1.08)}
.buttons button:active{transform:scale(.98)}
.buttons button:disabled{opacity:.55;cursor:wait}
.add{background:#267b82}
.save{background:#37845b}
.next{background:#376c9e}
.previous{background:#70619a}
.delete{background:#a64d52}
.close{background:#647487}
#message{display:none}
@media(max-width:480px){
body{padding:8px}
.user-container{padding:19px 15px}
h2{font-size:21px;margin-bottom:16px}
.fields{gap:6px}
.input-group{height:46px}
.buttons{gap:6px;margin-top:9px}
.buttons button{height:42px;font-size:10px;gap:4px}
.buttons button svg{width:14px;height:14px}
}
@media(max-height:520px){
.user-container{padding:10px 20px}
h2{font-size:20px;margin-bottom:9px;padding-bottom:8px}
.fields{gap:5px}
.input-group{height:38px}
.buttons{gap:5px;margin-top:8px}
.buttons button{height:34px}
}
</style>
</head>
<body>
<div class="user-wrapper">
<div class="user-container">
<section class="user-card">
<h2>Add New User</h2>
<div class="fields">
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
<input id="userid" type="number" placeholder="User ID" readonly>
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg>
<input id="username" type="text" placeholder="User Name" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>
<input id="email" type="email" placeholder="Email Address" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3M12 15v3"/></svg>
<input id="userpassword" type="password" placeholder="User Password" autocomplete="new-password">
</div>
</div>
<div class="buttons">
<button id="addBtn" class="add" type="button" onclick="addNew()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add New</button>
<button id="saveBtn" class="save" type="button" onclick="saveUser()"><svg viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3z"/><path d="M7 3v7h10V3M7 21v-7h10v7"/></svg>Save/Edit</button>
<button id="nextBtn" class="next" type="button" onclick="nextRecord()"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></svg>Next Rec</button>
<button id="previousBtn" class="previous" type="button" onclick="previousRecord()"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>Previous</button>
<button id="deleteBtn" class="delete" type="button" onclick="deleteUser()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>Delete</button>
<button id="closeBtn" class="close" type="button" onclick="closeForm()"><svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg>Close</button>
</div>
<p id="message"></p>
</section>
</div>
</div>
<script>
const WORKER_URL="https://young-river-e88c.ghulam-safi85.workers.dev";
const REQUEST_TIMEOUT=20000;
let users=[];
let currentIndex=-1;
let currentUid=null;
let busy=false;
let ready=false;
let loadingPromise=null;
const el=id=>document.getElementById(id);
function adminToken(){return sessionStorage.getItem("firebaseIdToken")||"";}
function setBusy(value){
busy=value;
["addBtn","saveBtn","nextBtn","previousBtn","deleteBtn"].forEach(id=>el(id).disabled=value);
}
async function request(path,data={}){
const token=adminToken();
if(!token)throw new Error("Administrator session expired. Please login again.");
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT);
try{
const response=await fetch(WORKER_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,adminToken:token}),signal:controller.signal,cache:"no-store"});
let result;
try{result=await response.json();}catch(e){throw new Error("Invalid response received from cloud.");}
if(!response.ok||!result.success)throw new Error(result.message||"Cloud request failed.");
return result;
}catch(e){
if(e.name==="AbortError")throw new Error("Connection timed out. Please try again.");
throw e;
}finally{clearTimeout(timer);}
}
function nextId(){
const adminId=Number(sessionStorage.getItem("currentUserId"))||1;
return users.reduce((max,u)=>Math.max(max,Number(u.userid)||0),adminId)+1;
}
function clearFields(){
el("userid").value=nextId();
el("username").value="";
el("email").value="";
el("userpassword").value="";
currentUid=null;
currentIndex=-1;
}
function showRecord(index){
if(index<0||index>=users.length)return false;
const user=users[index];
currentIndex=index;
currentUid=user.uid;
el("userid").value=user.userid||"";
el("username").value=user.username||"";
el("email").value=user.email||"";
el("userpassword").value="";
return true;
}
function sortUsers(){
users.sort((a,b)=>(Number(a.userid)||0)-(Number(b.userid)||0));
}
async function loadUsers(selectUid=null){
const result=await request("/list-users");
users=Array.isArray(result.users)?result.users:[];
sortUsers();
if(selectUid){
const index=users.findIndex(u=>u.uid===selectUid);
if(index>=0){showRecord(index);return;}
}
clearFields();
}
async function ensureReady(){
if(ready)return;
if(loadingPromise)await loadingPromise;
if(ready)return;
loadingPromise=loadUsers();
try{
await loadingPromise;
ready=true;
}catch(e){
throw e;
}finally{
loadingPromise=null;
}
}
function startForm(){
clearFields();
loadingPromise=loadUsers().then(()=>{
ready=true;
clearFields();
}).catch(()=>{
ready=false;
}).finally(()=>{
loadingPromise=null;
});
}
async function addNew(){
if(busy)return;
try{
await ensureReady();
clearFields();
el("username").focus();
}catch(e){alert(e.message);}
}
function validateUser(){
const username=el("username").value.trim();
const email=el("email").value.trim();
const password=el("userpassword").value;
const userid=Number(el("userid").value);
if(!username)throw new Error("Please enter a username.");
if(!email)throw new Error("Please enter an email address.");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("Please enter a valid email address.");
if(!currentUid&&password.length<6)throw new Error("Password must contain at least 6 characters.");
if(password&&password.length<6)throw new Error("Password must contain at least 6 characters.");
if(!Number.isInteger(userid)||userid<1)throw new Error("Invalid User ID.");
return {username,email,password,userid};
}
async function saveUser(){
if(busy)return;
setBusy(true);
try{
await ensureReady();
const data=validateUser();
const selectedUid=currentUid;
let result;
if(selectedUid){
const payload={uid:selectedUid,username:data.username,email:data.email};
if(data.password)payload.password=data.password;
result=await request("/update-user",payload);
}else{
result=await request("/create-user",{userid:data.userid,username:data.username,email:data.email,password:data.password});
}
await loadUsers(result.uid||selectedUid);
alert(result.message||"User saved successfully.");
}catch(e){
alert(e.message||"Unable to save user.");
}finally{
setBusy(false);
}
}
async function nextRecord(){
if(busy)return;
setBusy(true);
try{
await ensureReady();
if(!users.length)throw new Error("No user records found.");
if(currentIndex<0){showRecord(0);return;}
if(currentIndex>=users.length-1)throw new Error("Last record reached.");
showRecord(currentIndex+1);
}catch(e){alert(e.message);}
finally{setBusy(false);}
}
async function previousRecord(){
if(busy)return;
setBusy(true);
try{
await ensureReady();
if(!users.length)throw new Error("No user records found.");
if(currentIndex<0){showRecord(users.length-1);return;}
if(currentIndex===0)throw new Error("First record reached.");
showRecord(currentIndex-1);
}catch(e){alert(e.message);}
finally{setBusy(false);}
}
async function deleteUser(){
if(busy)return;
setBusy(true);
try{
await ensureReady();
if(!currentUid)throw new Error("Please select a user first.");
const selectedUid=currentUid;
const selectedIndex=currentIndex;
if(!confirm("Are you sure you want to delete this user?"))return;
const result=await request("/delete-user",{uid:selectedUid});
await loadUsers();
if(users.length)showRecord(Math.min(selectedIndex,users.length-1));
else clearFields();
alert(result.message||"User deleted successfully.");
}catch(e){
alert(e.message||"Unable to delete user.");
}finally{
setBusy(false);
}
}
function closeForm(){
try{
if(window.parent&&window.parent!==window){
const panel=window.parent.document.getElementById("MainPanel");
if(panel){panel.innerHTML="";return;}
}
}catch(e){}
window.close();
}
startForm();
</script>
</body>
</html>
