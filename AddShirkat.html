
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Shirkat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#edf2f7;font-family:Arial,sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:clamp(5px,1.5vh,12px)}
.card{width:100%;max-width:560px;max-height:100%;overflow:hidden;background:white;padding:clamp(10px,1.8vh,16px);border-radius:14px;box-shadow:0 5px 22px #123e6220;border-top:5px solid #087e8b}
h2{text-align:center;color:#123e62;margin:0 0 clamp(7px,1.2vh,12px);font-size:22px}
.fields{display:flex;flex-direction:column;gap:clamp(4px,.8vh,7px)}
.input-group{height:clamp(34px,5.5vh,43px);width:100%;display:flex;align-items:center;padding:0 12px;border:1px solid #b8cbd8;border-radius:8px;background:#f8fbfd;transition:.2s;flex-shrink:0}
.input-group:focus-within{border-color:#087e8b;box-shadow:0 0 0 3px #087e8b20;background:white}
.input-group>svg{width:21px;height:21px;fill:none;stroke:#123e62;stroke-width:2;flex-shrink:0}
.input-group input{flex:1;min-width:0;width:100%;height:100%;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#123e62!important;-webkit-text-fill-color:#123e62!important;caret-color:#087e8b;font-size:15px;padding:0 12px;text-align:center}
.input-group input:focus,.input-group input:active{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;color:#123e62!important;-webkit-text-fill-color:#123e62!important}
.input-group input::placeholder{color:#78909c;-webkit-text-fill-color:#78909c;opacity:1}
.input-group input[readonly]{color:#075985!important;-webkit-text-fill-color:#075985!important;font-weight:bold;cursor:default}
.input-group input:-webkit-autofill,.input-group input:-webkit-autofill:hover,.input-group input:-webkit-autofill:focus{-webkit-text-fill-color:#123e62!important;-webkit-box-shadow:0 0 0 1000px transparent inset!important;box-shadow:0 0 0 1000px transparent inset!important;transition:background-color 9999s ease-in-out 0s}
.image-area{height:clamp(75px,18vh,150px);margin-top:clamp(5px,1vh,9px);display:flex;justify-content:center;align-items:center;background:#f8fbfd;border:1px dashed #9bb5c5;border-radius:9px;overflow:hidden;padding:5px}
#logoPreview{max-width:100%;max-height:calc(100% - 5px);width:auto;height:auto;object-fit:contain;cursor:zoom-in;touch-action:manipulation}
#imagePlaceholder{color:#78909c;font-size:13px}
#imageInput{display:none}
.buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,.8vh,7px);margin-top:clamp(6px,1.2vh,10px)}
button{height:clamp(34px,5.6vh,44px);width:100%;border:0;border-radius:8px;color:white;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 2px 5px #0002;transition:.15s;padding:4px 2px}
button:active{transform:scale(.97)}
.add{background:#087e8b}.save{background:#16803c}.next{background:#2563eb}.previous{background:#7c3aed}.delete{background:#dc3545}.close{background:#475569}.select{background:#0d9488}.clear{background:#64748b}
button:hover{filter:brightness(.9)}
#message{text-align:center;min-height:16px;margin:6px 0 0;font-size:12px;font-weight:bold;color:#16803c;overflow-wrap:anywhere}
#imageViewer{display:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#05080d;z-index:99999;align-items:center;justify-content:center;padding:58px 8px 12px;touch-action:manipulation}
#imageViewer.active{display:flex}
#fullImage{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.viewer-actions{position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:flex-end;gap:9px;z-index:2}
.viewer-actions button{width:auto;min-width:94px;height:42px;padding:0 14px;font-size:13px}
.viewer-download{background:#16803c}
.viewer-close{background:#dc3545}
@media(max-width:380px){
body{padding:5px}
.card{padding:9px}
h2{font-size:20px;margin-bottom:7px}
.buttons{gap:4px}
button{font-size:10px;padding:3px 1px}
.input-group{padding:0 8px}
.input-group input{font-size:13px;padding:0 7px}
.input-group>svg{width:18px;height:18px}
}
@media(max-height:650px){
.card{padding:10px 14px}
h2{font-size:20px;margin-bottom:7px}
.fields{gap:4px}
.input-group{height:36px}
.input-group>svg{width:18px;height:18px}
.image-area{height:90px;margin-top:5px}
.buttons{gap:5px;margin-top:6px}
button{height:36px;font-size:11px}
#message{min-height:14px;margin-top:4px;font-size:11px}
}
@media(max-height:500px){
body{padding:4px}
.card{padding:7px 12px;border-top-width:3px}
h2{font-size:18px;margin-bottom:5px}
.fields{gap:3px}
.input-group{height:31px}
.input-group>svg{width:16px;height:16px}
.input-group input{font-size:13px}
.image-area{height:58px;margin-top:4px}
#logoPreview{max-height:52px}
.buttons{gap:4px;margin-top:5px}
button{height:31px;font-size:10px;border-radius:6px}
#message{min-height:12px;margin-top:3px;font-size:10px}
}
</style>
</head>
<body>
<section class="card">
<h2>Add Shirkat</h2>
<div class="fields">
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
<input id="shirkatid" type="number" placeholder="Company ID" readonly>
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><path d="M3 21V7l9-4 9 4v14M3 21h18M8 10h2m4 0h2M8 14h2m4 0h2M10 21v-4h4v4"/></svg>
<input id="shirkatname" type="text" placeholder="Company Name" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a16 16 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 5a2 2 0 012-2z"/></svg>
<input id="mobile" type="text" placeholder="Mobile Number" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
<input id="email" type="email" placeholder="Email Address" autocomplete="off">
</div>
<div class="input-group">
<svg viewBox="0 0 24 24"><path d="M12 22s8-7 8-13a8 8 0 10-16 0c0 6 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
<input id="address" type="text" placeholder="Company Address" autocomplete="off">
</div>
</div>
<div class="image-area">
<img id="logoPreview" style="display:none">
<span id="imagePlaceholder">Company Logo</span>
</div>
<input id="imageInput" type="file" accept="image/*">
<div class="buttons">
<button class="add" onclick="addNew()">➕ Add New</button>
<button class="save" onclick="saveShirkat()">💾 Save/Edit</button>
<button class="next" onclick="nextRecord()">⏭ Next</button>
<button class="previous" onclick="previousRecord()">⏮ Previous</button>
<button class="delete" onclick="deleteShirkat()">🗑 Delete</button>
<button class="close" onclick="closeForm()">✖ Close</button>
<button class="select" onclick="selectImage()">🖼 Select Image</button>
<button class="clear" onclick="clearImage()">🧹 Clear Image</button>
</div>
<p id="message"></p>
</section>
<div id="imageViewer" aria-hidden="true">
<div class="viewer-actions">
<button class="viewer-download" type="button" onclick="downloadCompanyImage()">⬇ Download</button>
<button class="viewer-close" type="button" onclick="closeImageViewer()">✖ Close</button>
</div>
<img id="fullImage" alt="Company Logo Full HD">
</div>
<script src="./sql-wasm.js"></script>
<script src="./Database/database.js"></script>
<script>
let currentId=null;
let logoData=null;
let logoUrl=null;
function showMessage(message,error=false){
const m=document.getElementById("message");
m.textContent=message;
m.style.color=error?"#dc3545":"#16803c";
}
function getCount(){
const r=db.exec("SELECT COUNT(*) FROM Shirkat");
return r.length?r[0].values[0][0]:0;
}
function nextId(){
const r=db.exec("SELECT COALESCE(MAX(shirkatid),0)+1 FROM Shirkat");
return r[0].values[0][0];
}
function showLogo(data){
const img=document.getElementById("logoPreview");
const placeholder=document.getElementById("imagePlaceholder");
if(logoUrl){URL.revokeObjectURL(logoUrl);logoUrl=null}
if(!data||!data.length){
img.style.display="none";
img.removeAttribute("src");
placeholder.style.display="block";
return;
}
logoData=new Uint8Array(data);
const blob=new Blob([logoData],{type:"image/webp"});
logoUrl=URL.createObjectURL(blob);
img.src=logoUrl;
img.style.display="block";
placeholder.style.display="none";
}
document.getElementById("logoPreview").addEventListener("dblclick",openImageViewer);
document.getElementById("logoPreview").addEventListener("touchend",function(e){
const now=Date.now();
if(this._lastTap&&now-this._lastTap<350){e.preventDefault();openImageViewer()}
this._lastTap=now;
},{passive:false});
function openImageViewer(){
if(!logoData||!logoData.length)return;
const viewer=document.getElementById("imageViewer");
const full=document.getElementById("fullImage");
const blob=new Blob([logoData],{type:"image/webp"});
if(full._objectUrl)URL.revokeObjectURL(full._objectUrl);
full._objectUrl=URL.createObjectURL(blob);
full.src=full._objectUrl;
viewer.classList.add("active");
viewer.setAttribute("aria-hidden","false");
document.body.style.overflow="hidden";
if(viewer.requestFullscreen){const p=viewer.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}
}
function closeImageViewer(){
const viewer=document.getElementById("imageViewer");
viewer.classList.remove("active");
viewer.setAttribute("aria-hidden","true");
document.body.style.overflow="";
if(document.fullscreenElement&&document.exitFullscreen){const p=document.exitFullscreen();if(p&&p.catch)p.catch(()=>{})}
}
function downloadCompanyImage(){
if(!logoData||!logoData.length)return showMessage("No company image available.",true);
const blob=new Blob([logoData],{type:"image/webp"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="Company-"+(document.getElementById("shirkatid").value||"Logo")+".webp";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeImageViewer()});
function loadImage(file){
return new Promise((resolve,reject)=>{
if(window.createImageBitmap){
createImageBitmap(file,{imageOrientation:"from-image"}).then(resolve).catch(()=>loadImageFallback(file).then(resolve).catch(reject));
}else loadImageFallback(file).then(resolve).catch(reject);
});
}
function loadImageFallback(file){
return new Promise((resolve,reject)=>{
const url=URL.createObjectURL(file);
const img=new Image();
img.onload=()=>{
URL.revokeObjectURL(url);
resolve({width:img.naturalWidth,height:img.naturalHeight,source:img,close:function(){}});
};
img.onerror=()=>{
URL.revokeObjectURL(url);
reject(new Error("This image format is not supported by your browser."));
};
img.src=url;
});
}
async function compressImage(file){
const bitmap=await loadImage(file);
try{
const maxSize=1920;
const scale=Math.min(1,maxSize/Math.max(bitmap.width,bitmap.height));
const width=Math.max(1,Math.round(bitmap.width*scale));
const height=Math.max(1,Math.round(bitmap.height*scale));
const canvas=document.createElement("canvas");
canvas.width=width;
canvas.height=height;
const ctx=canvas.getContext("2d",{alpha:false});
if(!ctx)throw new Error("Image processing is not supported.");
ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,width,height);
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality="high";
ctx.drawImage(bitmap.source||bitmap,0,0,width,height);
const blob=await new Promise((resolve,reject)=>{
canvas.toBlob(result=>result?resolve(result):reject(new Error("WebP conversion failed.")),"image/webp",0.90);
});
if(blob.type!=="image/webp")throw new Error("WebP format is not supported by this browser.");
return new Uint8Array(await blob.arrayBuffer());
}finally{
if(bitmap.close)bitmap.close();
}
}
function clearImage(){
logoData=null;
showLogo(null);
document.getElementById("imageInput").value="";
showMessage("Image cleared.");
}
function selectImage(){
document.getElementById("imageInput").click();
}
document.getElementById("imageInput").addEventListener("change",async function(){
const file=this.files[0];
if(!file)return;
try{
showMessage("Reading and processing image...");
const compressed=await compressImage(file);
logoData=compressed;
showLogo(compressed);
showMessage("HD image processed. Size: "+(compressed.length/1024).toFixed(1)+" KB");
}catch(e){
logoData=null;
showLogo(null);
this.value="";
showMessage("Image processing failed: "+e.message,true);
}
});
function clearFields(message=""){
document.getElementById("shirkatid").value=nextId();
document.getElementById("shirkatname").value="";
document.getElementById("mobile").value="";
document.getElementById("email").value="";
document.getElementById("address").value="";
currentId=null;
logoData=null;
showLogo(null);
document.getElementById("imageInput").value="";
document.getElementById("shirkatname").focus();
if(message)showMessage(message);
}
function readRecord(id){
const s=db.prepare("SELECT shirkatid,shirkatname,mobile,email,address,logo FROM Shirkat WHERE shirkatid=?");
try{
s.bind([id]);
if(!s.step())return false;
const r=s.getAsObject();
document.getElementById("shirkatid").value=r.shirkatid;
document.getElementById("shirkatname").value=r.shirkatname||"";
document.getElementById("mobile").value=r.mobile||"";
document.getElementById("email").value=r.email||"";
document.getElementById("address").value=r.address||"";
currentId=r.shirkatid;
logoData=r.logo?new Uint8Array(r.logo):null;
showLogo(logoData);
document.getElementById("imageInput").value="";
document.getElementById("shirkatname").focus();
return true;
}finally{s.free()}
}
function addNew(){
try{
clearFields("New company record ready. ID: "+document.getElementById("shirkatid").value);
}catch(e){showMessage("Database error: "+e.message,true)}
}
function saveShirkat(){
const id=Number(document.getElementById("shirkatid").value);
const name=document.getElementById("shirkatname").value.trim();
const mobile=document.getElementById("mobile").value.trim();
const email=document.getElementById("email").value.trim();
const address=document.getElementById("address").value.trim();
if(!name)return showMessage("Please enter company name.",true);
try{
if(currentId===null){
if(id!==nextId())return showMessage("Invalid Company ID. Please click Add New.",true);
const s=db.prepare("INSERT INTO Shirkat(shirkatid,shirkatname,mobile,email,address,logo) VALUES(?,?,?,?,?,?)");
try{s.run([id,name,mobile,email,address,logoData])}finally{s.free()}
}else{
const s=db.prepare("UPDATE Shirkat SET shirkatname=?,mobile=?,email=?,address=?,logo=? WHERE shirkatid=?");
try{s.run([name,mobile,email,address,logoData,currentId])}finally{s.free()}
}
saveDatabase();
readRecord(id);
showMessage("Company saved successfully.");
}catch(e){showMessage("Unable to save company: "+e.message,true)}
}
function nextRecord(){
try{
let id=null;
if(currentId===null){
const r=db.exec("SELECT MIN(shirkatid) FROM Shirkat");
if(r.length)id=r[0].values[0][0];
}else{
const s=db.prepare("SELECT MIN(shirkatid) FROM Shirkat WHERE shirkatid>?");
try{s.bind([currentId]);if(s.step())id=s.get()[0]}finally{s.free()}
}
if(id===null){
clearFields("No next record. New ID: "+nextId());
return;
}
readRecord(id);
showMessage("Next record loaded.");
}catch(e){showMessage("Database error: "+e.message,true)}
}
function previousRecord(){
try{
let id=null;
if(currentId===null){
const r=db.exec("SELECT MAX(shirkatid) FROM Shirkat");
if(r.length)id=r[0].values[0][0];
}else{
const s=db.prepare("SELECT MAX(shirkatid) FROM Shirkat WHERE shirkatid<?");
try{s.bind([currentId]);if(s.step())id=s.get()[0]}finally{s.free()}
}
if(id===null){
clearFields("First record reached. New ID: "+nextId());
return;
}
readRecord(id);
showMessage("Previous record loaded.");
}catch(e){showMessage("Database error: "+e.message,true)}
}
function deleteShirkat(){
try{
if(currentId===null)return showMessage("No company record selected.",true);
if(!confirm("Are you sure you want to delete this company?"))return;
const s=db.prepare("DELETE FROM Shirkat WHERE shirkatid=?");
try{s.run([currentId])}finally{s.free()}
saveDatabase();
clearFields("Company deleted successfully. New ID: "+nextId());
}catch(e){showMessage("Delete failed: "+e.message,true)}
}
function closeForm(){
window.parent.document.getElementById("MainPanel").innerHTML="";
}
async function startForm(){
try{
if(!window.initSqlJs)throw new Error("SQL.js library failed to load.");
await initDatabase("./");
db.run("CREATE TABLE IF NOT EXISTS Shirkat (shirkatid INTEGER PRIMARY KEY, shirkatname TEXT, mobile TEXT, email TEXT, address TEXT, logo BLOB)");
clearFields("Database initialized. New ID: "+nextId());
}catch(e){showMessage("Database initialization failed: "+(e.message||e),true)}
}
startForm();
</script>
</body>
</html>
