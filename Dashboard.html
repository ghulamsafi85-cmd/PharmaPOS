
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaPOS Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#071b32,#123e62,#087e8b);overflow:hidden;color:white}
.header{height:60px;background:rgba(255,255,255,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.2);color:#ffb547;display:flex;align-items:center;padding:0 18px;gap:15px;font-size:22px;font-weight:bold;box-shadow:0 4px 20px rgba(0,0,0,.15);position:relative;z-index:20}
.hamburger{width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:9px;cursor:pointer;flex-shrink:0}
.hamburger span{display:block;width:21px;height:2px;background:#ffb547;border-radius:3px}
.layout{display:flex;width:100%;height:calc(100vh - 60px);position:relative;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:rgba(255,255,255,.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.2);position:absolute;top:10px;left:10px;bottom:10px;z-index:15}
.sidebar.show{display:flex}
.submenu{width:220px;background:rgba(255,255,255,.13);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;display:none;position:absolute;left:230px;top:10px;z-index:16;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.submenu.show{display:block}
.menu-button{width:100%;padding:14px 10px;background:rgba(255,255,255,.09);color:#ffb547;border:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,181,71,.5);border-radius:9px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;transition:.25s}
.menu-button:hover,.menu-button.active{background:rgba(255,255,255,.2);border-color:#ffb547;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.logout-button{width:100%;padding:13px 10px;margin-top:auto;background:rgba(220,53,69,.65);backdrop-filter:blur(10px);color:white;border:1px solid rgba(255,255,255,.35);border-radius:9px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;transition:.25s}
.logout-button:hover{background:rgba(185,28,28,.85);box-shadow:0 5px 15px rgba(0,0,0,.2)}
.sub-button{width:100%;padding:13px 8px;margin-bottom:7px;background:rgba(18,62,98,.55);color:#ffb547;border:1px solid rgba(255,255,255,.2);border-radius:9px;text-align:left;font-size:14px;font-weight:bold;cursor:pointer;transition:.25s;backdrop-filter:blur(10px)}
.sub-button:last-child{margin-bottom:0}
.sub-button:hover{background:rgba(8,126,139,.75);color:white;border-color:#ffb547;transform:translateX(3px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.main-panel{display:block;flex:1;width:100%;min-width:0;height:100%;margin:0;padding:0;border:0;border-radius:0;overflow:auto;background:transparent}
.main-panel iframe{display:block;width:100%;height:100%;min-height:0;border:0;border-radius:0;background:transparent}
.admin-page{width:100%;min-height:100%;padding:22px;color:#fff}
.admin-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.admin-heading h2{margin:0;color:#ffb547;font-size:23px}
.admin-refresh{padding:10px 16px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(255,255,255,.13);color:#fff;font-weight:bold;cursor:pointer}
.admin-refresh:hover{background:rgba(255,255,255,.23)}
.admin-info{font-size:13px;color:#d9edf7;margin:0 0 14px}
.admin-table-wrap{width:100%;overflow:auto;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(4,24,43,.35)}
.admin-table{width:100%;border-collapse:collapse;min-width:850px}
.admin-table th,.admin-table td{padding:4px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.15);font-size:13px}
.admin-table th{background:rgba(255,181,71,.16);color:#ffca78;white-space:nowrap;padding:8px}
.admin-table tr:last-child td{border-bottom:0}
.admin-table tbody tr:hover{background:rgba(255,255,255,.07)}
.admin-table td:last-child{text-align:right;padding-right:5px}
.status{display:inline-block;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:bold}
.status.online{background:rgba(25,135,84,.25);color:#8ff0bd;border:1px solid rgba(90,220,155,.4)}
.status.offline{background:rgba(220,53,69,.2);color:#ffb3ba;border:1px solid rgba(255,120,130,.35)}
.action-buttons{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;align-items:center;width:100%}
.action-button{padding:4px 7px;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;white-space:nowrap}
.action-edit{background:#1769aa}
.action-password{background:#7952a3}
.action-logout{background:#b7791f}
.action-delete{background:#b52b3a}
.action-button:hover{filter:brightness(1.2)}
.admin-message{padding:15px;text-align:center;color:#ffe0a3}
.modal-overlay{position:fixed;inset:0;background:rgba(0,10,22,.76);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:15px;z-index:1000}
.modal-overlay.show{display:flex}
.modal-box{width:100%;max-width:430px;background:linear-gradient(145deg,#123b5c,#08243e);border:1px solid rgba(255,255,255,.25);border-radius:17px;box-shadow:0 20px 65px rgba(0,0,0,.55);overflow:hidden;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.13)}
.modal-title{margin:0;color:#ffbd59;font-size:19px;font-weight:bold}
.modal-close{width:30px;height:30px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer}
.modal-body{padding:22px 20px;color:#eaf5ff}
.modal-description{font-size:13px;line-height:1.6;color:#c7dbea;margin:0 0 16px}
.modal-label{display:block;font-size:12px;color:#ffcf83;margin:12px 0 6px;font-weight:bold}
.modal-input{width:100%;height:42px;padding:0 12px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.09);color:#fff;font-size:14px;outline:none}
.modal-input:focus{border-color:#ffb547;box-shadow:0 0 0 3px rgba(255,181,71,.12)}
.modal-input::placeholder{color:#a9bdcf}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.12)}
.modal-btn{min-width:95px;padding:10px 15px;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:white;font-size:13px;font-weight:bold;cursor:pointer;transition:.2s}
.modal-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.modal-cancel{background:rgba(255,255,255,.12)}
.modal-primary{background:linear-gradient(135deg,#087e8b,#1769aa)}
.modal-danger{background:linear-gradient(135deg,#b52b3a,#8e1d2a)}
.modal-success{background:linear-gradient(135deg,#16845a,#087e8b)}
.modal-icon{width:48px;height:48px;margin:0 auto 13px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,181,71,.15);border:1px solid rgba(255,181,71,.35);color:#ffbd59;font-size:25px}
.modal-message{text-align:center;font-size:14px;line-height:1.7;color:#eaf5ff;overflow-wrap:anywhere}
.modal-error{color:#ffb3ba;font-size:12px;margin-top:10px;display:none}
.modal-error.show{display:block}
@media(max-width:600px){
.header{font-size:19px;padding:0 12px;gap:12px}
.sidebar{width:165px;padding:8px;border-radius:10px;left:5px;top:5px;bottom:5px}
.submenu{width:180px;padding:8px;border-radius:10px;left:175px;top:5px}
.menu-button,.sub-button,.logout-button{font-size:12px;padding:12px 5px}
.sub-button{margin-bottom:5px}
.admin-page{padding:12px}
.admin-heading h2{font-size:19px}
.modal-box{max-width:390px}
.modal-body{padding:18px 16px}
}
</style>
</head>
<body>
<header class="header">
<button class="hamburger" onclick="toggleSidebar()" aria-label="Open menu"><span></span><span></span><span></span></button>
<span>PharmaPOS Dashboard</span>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
<button class="menu-button" id="masterButton" onclick="toggleMasterData()">Master Data <span id="masterArrow">›</span></button>
<button class="logout-button" onclick="logout()">🚪 Logout</button>
</aside>
<aside class="submenu" id="masterSubMenu">
<button class="sub-button" onclick="openForm('AddNewUser.html')">👤 Add New User</button>
<button class="sub-button" onclick="openForm('AddShirkat.html')">🏢 Add Shirkat</button>
<button class="sub-button" onclick="openForm('SmallAccounts.html')">📒 Small Accounts</button>
<button class="sub-button" onclick="openForm('AddNewEmploye.html')">👨‍💼 Add New Employe</button>
<button class="sub-button" onclick="openForm('AddNewAccount.html')">💳 Add New Account</button>
<button class="sub-button" onclick="openForm('AddNewProduct.html')">📦 Add New Product</button>
</aside>
<main class="main-panel" id="MainPanel"></main>
</div>
<div class="modal-overlay" id="appModal" onclick="modalBackdrop(event)">
<div class="modal-box">
<div class="modal-header">
<h3 class="modal-title" id="modalTitle">PharmaPOS</h3>
<button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-footer" id="modalFooter"></div>
</div>
</div>
<script>
const WORKER_BASE="https://young-river-e88c.ghulam-safi85.workers.dev";
const LOGIN_URL="https://ghulamsafi85-cmd.github.io/PharmaPOS/Login/Login.html";
const currentUid=sessionStorage.getItem("firebaseUid")||"";
const currentUsername=sessionStorage.getItem("currentUsername")||"";
const currentRole=(sessionStorage.getItem("currentUserRole")||"").toLowerCase();
const idToken=sessionStorage.getItem("firebaseIdToken")||"";
const sessionVersion=sessionStorage.getItem("sessionVersion")||"";
let adminRefreshTimer=null;
let heartbeatTimer=null;
let heartbeatBusy=false;
function toggleSidebar(){
const sidebar=document.getElementById("sidebar");
const submenu=document.getElementById("masterSubMenu");
const opened=sidebar.classList.toggle("show");
if(!opened){
submenu.classList.remove("show");
document.getElementById("masterButton").classList.remove("active");
document.getElementById("masterArrow").textContent="›";
}
}
function toggleMasterData(){
const menu=document.getElementById("masterSubMenu");
const button=document.getElementById("masterButton");
const opened=menu.classList.toggle("show");
button.classList.toggle("active",opened);
document.getElementById("masterArrow").textContent=opened?"‹":"›";
}
function openForm(file){
const panel=document.getElementById("MainPanel");
panel.innerHTML="";
const frame=document.createElement("iframe");
frame.src="./"+file;
frame.title=file;
panel.appendChild(frame);
document.getElementById("masterSubMenu").classList.remove("show");
document.getElementById("sidebar").classList.remove("show");
document.getElementById("masterButton").classList.remove("active");
document.getElementById("masterArrow").textContent="›";
}
function openModal(title,body,buttons){
document.getElementById("modalTitle").textContent=title;
document.getElementById("modalBody").innerHTML=body;
document.getElementById("modalFooter").innerHTML=buttons;
document.getElementById("appModal").classList.add("show");
}
function closeModal(){
document.getElementById("appModal").classList.remove("show");
}
function modalBackdrop(event){
if(event.target.id==="appModal")closeModal();
}
function showMessage(title,message,type){
const icon=type==="error"?"!":type==="success"?"✓":"i";
openModal(title,'<div class="modal-icon">'+icon+'</div><div class="modal-message">'+escapeHtml(message)+'</div>','<button class="modal-btn modal-success" onclick="closeModal()">OK</button>');
}
function showConfirm(title,message,action,danger){
const btnClass=danger?"modal-danger":"modal-primary";
openModal(title,'<div class="modal-icon">?</div><div class="modal-message">'+escapeHtml(message)+'</div>','<button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-btn '+btnClass+'" id="modalConfirmBtn">Confirm</button>');
document.getElementById("modalConfirmBtn").onclick=()=>{closeModal();action();};
}
function logout(){
showConfirm("Logout","Are you sure you want to logout?",forceLocalLogout,true);
}
function forceLocalLogout(){
sessionStorage.clear();
window.location.replace(LOGIN_URL);
}
async function workerRequest(path,payload){
const response=await fetch(WORKER_BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
const data=await response.json().catch(()=>({}));
if(!response.ok||!data.success){
if(data.forceLogout)forceLocalLogout();
throw new Error(data.message||"Request failed");
}
return data;
}
async function sendHeartbeat(){
if(heartbeatBusy)return;
heartbeatBusy=true;
try{
const response=await fetch(WORKER_BASE+"/heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken,uid:currentUid,sessionVersion}),cache:"no-store"});
const data=await response.json().catch(()=>({}));
if(data.forceLogout||response.status===401){forceLocalLogout();return;}
}catch(error){
console.warn("Session heartbeat failed:",error.message||error);
}finally{
heartbeatBusy=false;
}
}
function startHeartbeat(){
sendHeartbeat();
heartbeatTimer=setInterval(sendHeartbeat,25000);
}
function escapeHtml(value){
return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function showAdminPage(){
const panel=document.getElementById("MainPanel");
panel.innerHTML='<section class="admin-page"><div class="admin-heading"><h2>Users Management</h2><button class="admin-refresh" onclick="loadAdminUsers()">↻ Refresh</button></div><p class="admin-info">Manage user accounts, passwords, active status and remote logout.</p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>User ID</th><th>Username</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="adminUsersBody"><tr><td colspan="5" class="admin-message">Loading users...</td></tr></tbody></table></div></section>';
loadAdminUsers();
adminRefreshTimer=setInterval(loadAdminUsers,20000);
}
async function loadAdminUsers(){
if(!(currentUsername.toLowerCase()==="admin"&&currentRole==="admin"))return;
const body=document.getElementById("adminUsersBody");
if(!body)return;
try{
const data=await workerRequest("/list-users",{adminToken:idToken});
if(!document.getElementById("adminUsersBody"))return;
const target=document.getElementById("adminUsersBody");
if(!data.users||!data.users.length){
target.innerHTML='<tr><td colspan="5" class="admin-message">No users found.</td></tr>';
return;
}
target.innerHTML=data.users.map(user=>{
const status=user.online?'<span class="status online">● Online</span>':'<span class="status offline">● Offline</span>';
return '<tr><td>'+escapeHtml(user.userid)+'</td><td>'+escapeHtml(user.username)+'</td><td>'+escapeHtml(user.email)+'</td><td>'+status+'</td><td><div class="action-buttons"><button class="action-button action-edit" data-action="edit" data-uid="'+escapeHtml(user.uid)+'">Edit</button><button class="action-button action-password" data-action="password" data-uid="'+escapeHtml(user.uid)+'">Password</button><button class="action-button action-logout" data-action="logout" data-uid="'+escapeHtml(user.uid)+'" data-username="'+escapeHtml(user.username)+'">Logout</button><button class="action-button action-delete" data-action="delete" data-uid="'+escapeHtml(user.uid)+'" data-username="'+escapeHtml(user.username)+'">Delete</button></div></td></tr>';
}).join("");
}catch(error){
if(document.getElementById("adminUsersBody"))document.getElementById("adminUsersBody").innerHTML='<tr><td colspan="5" class="admin-message">'+escapeHtml(error.message)+'</td></tr>';
}
}
document.addEventListener("click",event=>{
const button=event.target.closest("[data-action]");
if(!button)return;
const action=button.dataset.action;
const uid=button.dataset.uid;
const username=button.dataset.username||"";
if(action==="edit")editUser(uid);
if(action==="password")changeUserPassword(uid);
if(action==="logout")remoteLogoutUser(uid,username);
if(action==="delete")deleteUser(uid,username);
});
async function getUserForEdit(uid){
try{
const data=await workerRequest("/list-users",{adminToken:idToken});
return (data.users||[]).find(user=>user.uid===uid)||null;
}catch(error){
showMessage("Request Failed",error.message,"error");
return null;
}
}
async function editUser(uid){
const data=await getUserForEdit(uid);
if(!data)return;
openModal("Edit User",'<p class="modal-description">Update the username and email address of this user.</p><label class="modal-label">Username</label><input class="modal-input" id="editUsername" maxlength="250" value="'+escapeHtml(data.username)+'"><label class="modal-label">Email Address</label><input class="modal-input" id="editEmail" type="email" maxlength="250" value="'+escapeHtml(data.email)+'"><div class="modal-error" id="modalError"></div>','<button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-btn modal-primary" id="saveUserBtn">Save Changes</button>');
document.getElementById("saveUserBtn").onclick=saveUserChanges.bind(null,uid);
document.getElementById("editUsername").focus();
}
async function saveUserChanges(uid){
const username=document.getElementById("editUsername").value.trim();
const email=document.getElementById("editEmail").value.trim();
if(!username||!email||!email.includes("@")){
showModalError("Please enter a valid username and email address.");
return;
}
const button=document.getElementById("saveUserBtn");
button.disabled=true;
button.textContent="Saving...";
try{
const result=await workerRequest("/update-user",{adminToken:idToken,uid,username,email,password:""});
closeModal();
showMessage("User Updated",result.message||"User information updated successfully.","success");
loadAdminUsers();
}catch(error){
button.disabled=false;
button.textContent="Save Changes";
showModalError(error.message);
}
}
function showModalError(message){
const element=document.getElementById("modalError");
if(element){
element.textContent=message;
element.classList.add("show");
}
}
async function changeUserPassword(uid){
openModal("Change Password",'<p class="modal-description">Enter a new password for this user. The password must contain at least 6 characters.</p><label class="modal-label">New Password</label><input class="modal-input" id="newUserPassword" type="password" maxlength="256" placeholder="Enter new password"><label class="modal-label">Confirm Password</label><input class="modal-input" id="confirmUserPassword" type="password" maxlength="256" placeholder="Confirm new password"><div class="modal-error" id="modalError"></div>','<button class="modal-btn modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-btn modal-primary" id="savePasswordBtn">Update Password</button>');
document.getElementById("savePasswordBtn").onclick=saveUserPassword.bind(null,uid);
document.getElementById("newUserPassword").focus();
}
async function saveUserPassword(uid){
const password=document.getElementById("newUserPassword").value;
const confirmPassword=document.getElementById("confirmUserPassword").value;
if(password.length<6||password.length>256){
showModalError("Password must contain between 6 and 256 characters.");
return;
}
if(password!==confirmPassword){
showModalError("The passwords do not match.");
return;
}
const button=document.getElementById("savePasswordBtn");
button.disabled=true;
button.textContent="Updating...";
try{
const data=await getUserForEdit(uid);
if(!data){button.disabled=false;button.textContent="Update Password";return;}
const result=await workerRequest("/update-user",{adminToken:idToken,uid,username:data.username,email:data.email,password});
closeModal();
showMessage("Password Updated",result.message||"Password changed successfully.","success");
}catch(error){
button.disabled=false;
button.textContent="Update Password";
showModalError(error.message);
}
}
async function remoteLogoutUser(uid,username){
showConfirm("Remote Logout","Are you sure you want to remotely logout "+username+" from all active sessions?",async()=>{
try{
const result=await workerRequest("/logout-user",{adminToken:idToken,uid});
showMessage("Remote Logout",result.message||"User sessions have been revoked.","success");
loadAdminUsers();
}catch(error){
showMessage("Logout Failed",error.message,"error");
}
},false);
}
async function deleteUser(uid,username){
showConfirm("Delete User","Are you sure you want to permanently delete user "+username+"? This action cannot be undone.",async()=>{
try{
const result=await workerRequest("/delete-user",{adminToken:idToken,uid});
showMessage("User Deleted",result.message||"User deleted successfully.","success");
loadAdminUsers();
}catch(error){
showMessage("Delete Failed",error.message,"error");
}
},true);
}
function initializeDashboard(){
if(!currentUid||!idToken||!sessionVersion||!currentUsername||!currentRole){
forceLocalLogout();
return;
}
startHeartbeat();
if(currentUsername.toLowerCase()==="admin"&&currentRole==="admin"){
showAdminPage();
}
}
document.addEventListener("DOMContentLoaded",initializeDashboard);
document.addEventListener("keydown",event=>{
if(event.key==="Escape")closeModal();
});
window.addEventListener("beforeunload",()=>{
if(adminRefreshTimer)clearInterval(adminRefreshTimer);
if(heartbeatTimer)clearInterval(heartbeatTimer);
});
</script>
</body>
</html>
