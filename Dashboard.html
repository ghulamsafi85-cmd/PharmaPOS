
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaPOS Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf2f7;overflow:hidden}
.header{height:60px;background:linear-gradient(90deg,#123e62,#087e8b);color:#ffb547;display:flex;align-items:center;padding:0 22px;font-size:22px;font-weight:bold}
.layout{display:flex;height:calc(100vh - 60px)}
.sidebar{width:210px;flex-shrink:0;background:#123e62;padding:12px;display:flex;flex-direction:column}
.submenu{width:220px;flex-shrink:0;background:#075985;padding:12px;display:none}
.menu-button{width:100%;padding:14px 10px;background:#123e62;color:#ffb547;border:0;border-bottom:1px solid #ffb547;text-align:left;font-size:15px;font-weight:bold;cursor:pointer}
.menu-button:hover,.menu-button.active{background:#123e62}
.logout-button{width:100%;padding:13px 10px;margin-top:auto;background:#dc3545;color:white;border:1px solid #ffb547;border-radius:7px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer}
.logout-button:hover{background:#b91c1c}
.sub-button{width:100%;padding:13px 8px;margin-bottom:7px;background:#123e62;color:#ffb547;border:1px solid #ffb547;border-radius:6px;text-align:left;font-size:14px;font-weight:bold;cursor:pointer;transition:.2s}
.sub-button:hover{background:#087e8b;color:white;border-color:#ffb547}
.main-panel{flex:1;min-width:0;background:#f1f5f9;padding:20px;overflow:auto}
@media(max-width:600px){.sidebar{width:125px;padding:6px}.submenu{width:155px;padding:6px}.menu-button,.sub-button,.logout-button{font-size:12px;padding:12px 5px}.sub-button{margin-bottom:5px}.main-panel{padding:8px}}
</style>
</head>
<body>
<header class="header">PharmaPOS Dashboard</header>
<div class="layout">
<aside class="sidebar">
<button class="menu-button" id="masterButton" onclick="toggleMasterData()">Master Data <span id="masterArrow">›</span></button>
<button class="logout-button" onclick="logout()">🚪 Logout</button>
</aside>
<aside class="submenu" id="masterSubMenu">
<button class="sub-button" onclick="openForm('AddNewUser.html')">👤 Add New User</button>
<button class="sub-button" onclick="openForm('AddShirkat.html')">🏢 Add Shirkat</button>
<button class="sub-button" onclick="openForm('SmallAccounts.html')">📒 Small Accounts</button>
<button class="sub-button" onclick="openForm('AddNewEmploye.html')">👨‍💼 Add New Employe</button>
<button class="sub-button" onclick="openForm('AddNewAccount.html')">💳 Add New Account</button>
<button class="sub-button" onclick="openForm('AddNewProduct.html')">📦 Add New Product</button>
</aside>
<main class="main-panel" id="MainPanel"></main>
</div>
<script>
function toggleMasterData(){
const menu=document.getElementById("masterSubMenu");
const button=document.getElementById("masterButton");
const opened=menu.style.display==="block";
menu.style.display=opened?"none":"block";
button.classList.toggle("active",!opened);
document.getElementById("masterArrow").textContent=opened?"›":"‹";
}
function openForm(file){
const panel=document.getElementById("MainPanel");
panel.innerHTML='<iframe src="'+file+'" style="width:100%;height:100%;min-height:500px;border:0;background:white"></iframe>';
document.getElementById("masterSubMenu").style.display="none";
document.getElementById("masterButton").classList.remove("active");
document.getElementById("masterArrow").textContent="›";
}
function logout(){
if(!confirm("Are you sure you want to logout?"))return;
sessionStorage.removeItem("currentUserId");
sessionStorage.removeItem("currentUsername");
window.location.replace("https://ghulamsafi85-cmd.github.io/PharmaPOS/Login/Login.html");
}
</script>
</body>
</html>
