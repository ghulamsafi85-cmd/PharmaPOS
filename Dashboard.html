
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaPOS Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#071b32,#123e62,#087e8b);min-height:100vh;overflow:hidden;color:white}
.header{height:60px;background:rgba(255,255,255,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.2);color:#ffb547;display:flex;align-items:center;padding:0 22px;font-size:22px;font-weight:bold;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.layout{display:flex;height:calc(100vh - 60px);align-items:stretch;gap:10px;padding:10px}
.sidebar{width:210px;flex-shrink:0;background:rgba(255,255,255,.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.submenu{width:220px;flex-shrink:0;background:rgba(255,255,255,.13);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;display:none;align-self:flex-start;height:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.menu-button{width:100%;padding:14px 10px;background:rgba(255,255,255,.09);color:#ffb547;border:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,181,71,.5);border-radius:9px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;transition:.25s}
.menu-button:hover,.menu-button.active{background:rgba(255,255,255,.2);border-color:#ffb547;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.logout-button{width:100%;padding:13px 10px;margin-top:auto;background:rgba(220,53,69,.65);backdrop-filter:blur(10px);color:white;border:1px solid rgba(255,255,255,.35);border-radius:9px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;transition:.25s}
.logout-button:hover{background:rgba(185,28,28,.85);box-shadow:0 5px 15px rgba(0,0,0,.2)}
.sub-button{width:100%;padding:13px 8px;margin-bottom:7px;background:rgba(18,62,98,.55);color:#ffb547;border:1px solid rgba(255,255,255,.2);border-radius:9px;text-align:left;font-size:14px;font-weight:bold;cursor:pointer;transition:.25s;backdrop-filter:blur(10px)}
.sub-button:last-child{margin-bottom:0}
.sub-button:hover{background:rgba(8,126,139,.75);color:white;border-color:#ffb547;transform:translateX(3px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.main-panel{flex:1;min-width:0;background:rgba(255,255,255,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:20px;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.main-panel iframe{border-radius:12px}
@media(max-width:600px){.layout{gap:5px;padding:5px}.sidebar{width:125px;padding:6px;border-radius:10px}.submenu{width:155px;padding:6px;border-radius:10px}.menu-button,.sub-button,.logout-button{font-size:12px;padding:12px 5px}.sub-button{margin-bottom:5px}.main-panel{padding:8px;border-radius:10px}}
</style>
</head>
<body>
<header class="header">PharmaPOS Dashboard</header>
<div class="layout">
<aside class="sidebar">
<button class="menu-button" id="masterButton" onclick="toggleMasterData()">Master Data <span id="masterArrow">›</span></button>
<button class="logout-button" onclick="logout()">🚪 Logout</button>
</aside>
<aside class="submenu" id="masterSubMenu">
<button class="sub-button" onclick="openForm('AddNewUser.html')">👤 Add New User</button>
<button class="sub-button" onclick="openForm('AddShirkat.html')">🏢 Add Shirkat</button>
<button class="sub-button" onclick="openForm('SmallAccounts.html')">📒 Small Accounts</button>
<button class="sub-button" onclick="openForm('AddNewEmploye.html')">👨‍💼 Add New Employe</button>
<button class="sub-button" onclick="openForm('AddNewAccount.html')">💳 Add New Account</button>
<button class="sub-button" onclick="openForm('AddNewProduct.html')">📦 Add New Product</button>
</aside>
<main class="main-panel" id="MainPanel"></main>
</div>
<script>
function toggleMasterData(){
const menu=document.getElementById("masterSubMenu");
const button=document.getElementById("masterButton");
const opened=menu.style.display==="block";
menu.style.display=opened?"none":"block";
button.classList.toggle("active",!opened);
document.getElementById("masterArrow").textContent=opened?"›":"‹";
}
function openForm(file){
const panel=document.getElementById("MainPanel");
panel.innerHTML='<iframe src="./'+file+'" style="width:100%;height:100%;min-height:500px;border:0;background:transparent"></iframe>';
document.getElementById("masterSubMenu").style.display="none";
document.getElementById("masterButton").classList.remove("active");
document.getElementById("masterArrow").textContent="›";
}
function logout(){
if(!confirm("Are you sure you want to logout?"))return;
sessionStorage.removeItem("currentUserId");
sessionStorage.removeItem("currentUsername");
window.location.replace("https://ghulamsafi85-cmd.github.io/PharmaPOS/Login/Login.html");
}
</script>
</body>
</html>
